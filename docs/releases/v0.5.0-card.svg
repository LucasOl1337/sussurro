<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="901" font-family="Liberation Sans, sans-serif"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#160D31"/><stop offset="1" stop-color="#28184D"/></linearGradient></defs><rect width="1200" height="901" fill="url(#bg)"/><text x="56" y="90" font-size="43" fill="#F8F5FF" font-weight="700">sussurro</text><text x="56" y="138" font-size="25" fill="#D8C4EA" font-weight="700">NOTAS DA ATUALIZAÇÃO · v0.5.0</text><text x="970" y="88" font-size="18" fill="#BCB1D2" font-weight="400">19 SET 2026</text><path d="M56 174H1144" stroke="#76638C" opacity=".5"/><rect x="56" y="202" width="6" height="28" rx="3" fill="#FFC61A"/><text x="80" y="225" font-size="26" fill="#FFC61A" font-weight="700">NOVIDADES</text><text x="1040" y="225" font-size="20" fill="#BCB1D2" font-weight="400">2 itens</text><text x="80" y="281" font-size="27" fill="#F8F5FF" font-weight="700">Uma frase para comparar os modelos</text><text x="80" y="315" font-size="23" fill="#BCB1D2" font-weight="400">Reutilize até 30 segundos de áudio e compare texto, carga e transcrição.</text><text x="80" y="370" font-size="27" fill="#F8F5FF" font-weight="700">Comparação em CPU ou NVIDIA</text><text x="80" y="404" font-size="23" fill="#BCB1D2" font-weight="400">Execute um modelo por vez ou até dois em paralelo; cancele os processos de teste.</text><path d="M56 459H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="490" width="6" height="28" rx="3" fill="#30BCEF"/><text x="80" y="513" font-size="26" fill="#30BCEF" font-weight="700">CORREÇÕES</text><text x="1040" y="513" font-size="20" fill="#BCB1D2" font-weight="400">2 itens</text><text x="80" y="569" font-size="27" fill="#F8F5FF" font-weight="700">Ditado no destino selecionado</text><text x="80" y="603" font-size="23" fill="#BCB1D2" font-weight="400">A colagem considera o workspace visível e confirma o foco antes de enviar.</text><text x="80" y="658" font-size="27" fill="#F8F5FF" font-weight="700">Texto disponível para colar novamente</text><text x="80" y="692" font-size="23" fill="#BCB1D2" font-weight="400">No Linux, o ditado permanece no clipboard; falhas impedem o Enter automático.</text><path d="M56 747H1144" stroke="#76638C" opacity=".35"/><text x="56" y="816" font-size="22" fill="#BCB1D2" font-weight="400">Notas completas e limites de validação no GitHub Releases.</text><text x="56" y="852" font-size="19" fill="#BCB1D2" font-weight="400">github.com/LucasOl1337/sussurro/releases</text><path d="M28 70V28H70 M1130 28H1172V70 M28 831V873H70 M1130 873H1172V831" stroke="#A593BB" fill="none" opacity=".5"/></svg>
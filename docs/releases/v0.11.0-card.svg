<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="993" viewBox="0 0 1200 993">
<style>text{font-family:Inter,"Noto Sans","Segoe UI",system-ui,sans-serif}</style>
<rect width="1200" height="993" fill="#FFFFFF"/>
<rect width="1200" height="6" fill="#1D4ED8"/><text x="56" y="92" font-size="40" font-weight="700" fill="#111827" text-anchor="start" letter-spacing="-0.4"><tspan x="56" dy="0">Sussurro</tspan></text><rect x="259.6" y="64" width="105.08" height="36" rx="18" fill="#EFF4FF"/><text x="312.14000000000004" y="88" font-size="18" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="0"><tspan x="312.14000000000004" dy="0">v0.11.0</tspan></text><text x="1144" y="72" font-size="15" font-weight="700" fill="#374151" text-anchor="end" letter-spacing="4"><tspan x="1144" dy="0">LUCASOL</tspan></text><text x="1144" y="98" font-size="16" font-weight="400" fill="#6B7280" text-anchor="end" letter-spacing="0"><tspan x="1144" dy="0">17 NOV 2026</tspan></text><text x="56" y="142" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="2.6"><tspan x="56" dy="0">NOTAS DA ATUALIZAÇÃO</tspan></text><rect x="56" y="160" width="122.8" height="34" rx="8" fill="#FFF8EC"/><text x="117.4" y="182" font-size="16" font-weight="600" fill="#B45309" text-anchor="middle" letter-spacing="0"><tspan x="117.4" dy="0">1 novidade</tspan></text><rect x="188.8" y="160" width="132.07999999999998" height="34" rx="8" fill="#EFF4FF"/><text x="254.84" y="182" font-size="16" font-weight="600" fill="#1D4ED8" text-anchor="middle" letter-spacing="0"><tspan x="254.84" dy="0">4 correções</tspan></text><line x1="56" y1="220" x2="1144" y2="220" stroke="#E5E7EB" stroke-width="2"/><rect x="56" y="248" width="5" height="24" rx="2.5" fill="#B45309"/><text x="74" y="268" font-size="17" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="2"><tspan x="74" dy="0">NOVIDADES</tspan></text><rect x="206.04000000000002" y="249" width="30" height="24" rx="12" fill="#FFF8EC"/><text x="221.04000000000002" y="267" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle" letter-spacing="0"><tspan x="221.04000000000002" dy="0">1</tspan></text><circle cx="64" cy="312" r="5" fill="#B45309"/><text x="86" y="320" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Indicador de reunião discreto</tspan></text><text x="86" y="355" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Pílula pequena com ponto e tempo, com pausar e esconder ao passar o mouse. Fica</tspan><tspan x="86" dy="27">onde você soltar e não persegue o cursor.</tspan></text><text x="1144" y="318" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">REUNIÃO</tspan></text><rect x="56" y="430" width="5" height="24" rx="2.5" fill="#1D4ED8"/><text x="74" y="450" font-size="17" font-weight="700" fill="#1D4ED8" text-anchor="start" letter-spacing="2"><tspan x="74" dy="0">CORREÇÕES</tspan></text><rect x="206.04000000000002" y="431" width="30" height="24" rx="12" fill="#EFF4FF"/><text x="221.04000000000002" y="449" font-size="15" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="0"><tspan x="221.04000000000002" dy="0">4</tspan></text><circle cx="64" cy="494" r="5" fill="#1D4ED8"/><text x="86" y="502" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">X e ✓ da barra voltam a clicar</tspan></text><text x="86" y="537" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">No Omarchy 4.5 a barra de título do workspace flutuante cobria os botões. A cápsula</tspan><tspan x="86" dy="27">agora fica sem ela.</tspan></text><text x="1144" y="500" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">OMARCHY 4.5</tspan></text><line x1="86" y1="602" x2="1144" y2="602" stroke="#E5E7EB"/><circle cx="64" cy="618" r="5" fill="#1D4ED8"/><text x="86" y="626" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Arrastar a barra de verdade</tspan></text><text x="86" y="661" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">A barra se move com o mouse e a posição fica salva onde você soltou.</tspan></text><text x="1144" y="624" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">DITADO</tspan></text><line x1="86" y1="699" x2="1144" y2="699" stroke="#E5E7EB"/><circle cx="64" cy="715" r="5" fill="#1D4ED8"/><text x="86" y="723" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Monitor em retrato</tspan></text><text x="86" y="758" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Com tela girada, a barra não cai mais fora da tela e o ditado cola na janela certa.</tspan></text><text x="1144" y="721" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">DITADO</tspan></text><line x1="86" y1="796" x2="1144" y2="796" stroke="#E5E7EB"/><circle cx="64" cy="812" r="5" fill="#1D4ED8"/><text x="86" y="820" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Cursor no painel de configurações</tspan></text><text x="86" y="855" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">O ponteiro não some mais sobre o painel no Omarchy 4.5.</tspan></text><text x="1144" y="818" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">CONFIGURAÇÕES</tspan></text><line x1="56" y1="923" x2="1144" y2="923" stroke="#E5E7EB" stroke-width="2"/><text x="56" y="957" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0"><tspan x="56" dy="0">Notas completas: github.com/LucasOl1337/sussurro/releases/tag/v0.11.0</tspan></text>
</svg>

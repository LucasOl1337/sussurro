<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1462" viewBox="0 0 1200 1462">
<style>text{font-family:Inter,"Noto Sans","Segoe UI",system-ui,sans-serif}</style>
<rect width="1200" height="1462" fill="#FFFFFF"/>
<rect width="1200" height="6" fill="#1D4ED8"/><text x="56" y="92" font-size="40" font-weight="700" fill="#111827" text-anchor="start" letter-spacing="-0.4"><tspan x="56" dy="0">Sussurro</tspan></text><rect x="259.6" y="64" width="105.08" height="36" rx="18" fill="#EFF4FF"/><text x="312.14000000000004" y="88" font-size="18" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="0"><tspan x="312.14000000000004" dy="0">v0.10.0</tspan></text><text x="1144" y="72" font-size="15" font-weight="700" fill="#374151" text-anchor="end" letter-spacing="4"><tspan x="1144" dy="0">LUCASOL</tspan></text><text x="1144" y="98" font-size="16" font-weight="400" fill="#6B7280" text-anchor="end" letter-spacing="0"><tspan x="1144" dy="0">23 OUT 2026</tspan></text><text x="56" y="142" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="2.6"><tspan x="56" dy="0">NOTAS DA ATUALIZAÇÃO</tspan></text><rect x="56" y="160" width="132.07999999999998" height="34" rx="8" fill="#FFF8EC"/><text x="122.03999999999999" y="182" font-size="16" font-weight="600" fill="#B45309" text-anchor="middle" letter-spacing="0"><tspan x="122.03999999999999" dy="0">4 novidades</tspan></text><rect x="198.07999999999998" y="160" width="132.07999999999998" height="34" rx="8" fill="#EFF4FF"/><text x="264.12" y="182" font-size="16" font-weight="600" fill="#1D4ED8" text-anchor="middle" letter-spacing="0"><tspan x="264.12" dy="0">5 correções</tspan></text><line x1="56" y1="220" x2="1144" y2="220" stroke="#E5E7EB" stroke-width="2"/><rect x="56" y="248" width="5" height="24" rx="2.5" fill="#B45309"/><text x="74" y="268" font-size="17" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="2"><tspan x="74" dy="0">NOVIDADES</tspan></text><rect x="206.04000000000002" y="249" width="30" height="24" rx="12" fill="#FFF8EC"/><text x="221.04000000000002" y="267" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle" letter-spacing="0"><tspan x="221.04000000000002" dy="0">4</tspan></text><circle cx="64" cy="312" r="5" fill="#B45309"/><text x="86" y="320" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Escolher o modelo da reunião</tspan></text><text x="86" y="355" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">O MOTOR da aba REUNIÃO lista Turbo, Large-v3, Grok e ElevenLabs, sem depender do</tspan><tspan x="86" dy="27">modelo do ditado.</tspan></text><text x="1144" y="318" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">REUNIÃO</tspan></text><line x1="86" y1="420" x2="1144" y2="420" stroke="#E5E7EB"/><circle cx="64" cy="436" r="5" fill="#B45309"/><text x="86" y="444" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Refazer com outro modelo</tspan></text><text x="86" y="479" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">A reunião pronta transcreve de novo o áudio salvo com o modelo e o idioma</tspan><tspan x="86" dy="27">escolhidos ali.</tspan></text><text x="1144" y="442" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">REUNIÃO</tspan></text><line x1="86" y1="544" x2="1144" y2="544" stroke="#E5E7EB"/><circle cx="64" cy="560" r="5" fill="#B45309"/><text x="86" y="568" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Lista de reuniões</tspan></text><text x="86" y="603" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Uma coluna à esquerda mostra todas as reuniões salvas; um clique troca de reunião.</tspan></text><text x="1144" y="566" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">REUNIÃO</tspan></text><line x1="86" y1="641" x2="1144" y2="641" stroke="#E5E7EB"/><circle cx="64" cy="657" r="5" fill="#B45309"/><text x="86" y="665" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Copiar um trecho do histórico</tspan></text><text x="86" y="700" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Arrastar o mouse seleciona só um pedaço do ditado, e o Ctrl+C copia esse pedaço.</tspan></text><text x="1144" y="663" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">HISTÓRICO</tspan></text><rect x="56" y="748" width="5" height="24" rx="2.5" fill="#1D4ED8"/><text x="74" y="768" font-size="17" font-weight="700" fill="#1D4ED8" text-anchor="start" letter-spacing="2"><tspan x="74" dy="0">CORREÇÕES</tspan></text><rect x="206.04000000000002" y="749" width="30" height="24" rx="12" fill="#EFF4FF"/><text x="221.04000000000002" y="767" font-size="15" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="0"><tspan x="221.04000000000002" dy="0">5</tspan></text><circle cx="64" cy="812" r="5" fill="#1D4ED8"/><text x="86" y="820" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Reunião longa não repete frase</tspan></text><text x="86" y="855" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Numa reunião de 39 min, a transcrição saiu com 1.490 trechos em vez de 181, sem</tspan><tspan x="86" dy="27">repetir &quot;O que acontece, tá?&quot;.</tspan></text><text x="1144" y="818" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">REUNIÃO</tspan></text><line x1="86" y1="920" x2="1144" y2="920" stroke="#E5E7EB"/><circle cx="64" cy="936" r="5" fill="#1D4ED8"/><text x="86" y="944" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Copiar não trava o app</tspan></text><text x="86" y="979" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">A cópia sai por fora da janela, e o Sussurro não congela mais ao copiar no Omarchy.</tspan></text><text x="1144" y="942" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">HISTÓRICO</tspan></text><line x1="86" y1="1017" x2="1144" y2="1017" stroke="#E5E7EB"/><circle cx="64" cy="1033" r="5" fill="#1D4ED8"/><text x="86" y="1041" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Fechar encerra de verdade</tspan></text><text x="86" y="1076" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Super+W ou o X da janela fecham o Sussurro, como qualquer programa.</tspan></text><text x="1144" y="1039" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">LINUX</tspan></text><line x1="86" y1="1114" x2="1144" y2="1114" stroke="#E5E7EB"/><circle cx="64" cy="1130" r="5" fill="#1D4ED8"/><text x="86" y="1138" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Reuniões antigas aparecem de novo</tspan></text><text x="86" y="1173" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Sem a pasta Documentos configurada, o app volta a achar as reuniões em</tspan><tspan x="86" dy="27">~/Documents/Reuniões.</tspan></text><text x="1144" y="1136" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">REUNIÃO</tspan></text><line x1="86" y1="1238" x2="1144" y2="1238" stroke="#E5E7EB"/><circle cx="64" cy="1254" r="5" fill="#1D4ED8"/><text x="86" y="1262" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Barra certa em escala 1,5</tspan></text><text x="86" y="1297" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">A cápsula de gravação ocupa a janela toda, sem moldura cinza, e o X e o ✓ respondem</tspan><tspan x="86" dy="27">no lugar.</tspan></text><text x="1144" y="1260" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">BARRA</tspan></text><line x1="56" y1="1392" x2="1144" y2="1392" stroke="#E5E7EB" stroke-width="2"/><text x="56" y="1426" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0"><tspan x="56" dy="0">Notas completas: github.com/LucasOl1337/sussurro/releases/tag/v0.10.0</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1688" viewBox="0 0 1200 1688" font-family="Noto Sans, Liberation Sans, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#160D31"/><stop offset="1" stop-color="#28184D"/></linearGradient><linearGradient id="pill" x1="0" x2="1"><stop stop-color="#C98A6B"/><stop offset="1" stop-color="#8E5CF0"/></linearGradient></defs><rect width="1200" height="1688" fill="url(#bg)"/><path d="M920 30L1196 300M1000 30L1196 226" stroke="#BCB1D2" opacity=".08"/><path d="M28 70V28H70M1130 28H1172V70M28 1618V1660H70M1130 1660H1172V1618" fill="none" stroke="#76638C" stroke-width="2" opacity=".8"/><text x="56" y="92" font-size="46" fill="#F8F5FF" font-weight="700">sussurro</text><rect x="262" y="58" width="112" height="44" rx="22" fill="url(#pill)"/><text x="318" y="88" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">v0.9.0</text><text x="56" y="144" font-size="22" fill="#FFC89A" font-weight="700" letter-spacing="3">NOTAS DA ATUALIZAÇÃO</text><text x="1144" y="88" font-size="20" fill="#BCB1D2" text-anchor="end">20 de outubro de 2026</text><path d="M56 178H1144" stroke="#76638C" opacity=".55"/><text x="56" y="218" font-size="20" fill="#BCB1D2">Reunião na nuvem · quem falou o quê sem GPU · gasto do mês à vista</text><rect x="56" y="262" width="6" height="30" rx="3" fill="#FFC61A"/><text x="80" y="287" font-size="25" fill="#FFC61A" font-weight="700" letter-spacing="3">NOVIDADES</text><text x="1144" y="286" font-size="19" fill="#BCB1D2" text-anchor="end">4 itens</text><circle cx="87" cy="327" r="6" fill="#FFC61A"/><text x="108" y="336" font-size="27" fill="#F8F5FF" font-weight="700">Reunião na nuvem</text><text x="1144" y="334" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">REUNIÃO</text><text x="108" y="372" font-size="22" fill="#BCB1D2">Grok ou ElevenLabs transcrevem e separam as vozes, sem GPU.</text><circle cx="87" cy="417" r="6" fill="#FFC61A"/><text x="108" y="426" font-size="27" fill="#F8F5FF" font-weight="700">Combo MOTOR</text><text x="1144" y="424" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">REUNIÃO</text><text x="108" y="462" font-size="22" fill="#BCB1D2">Local, Grok ou ElevenLabs; o padrão continua Local.</text><circle cx="87" cy="507" r="6" fill="#FFC61A"/><text x="108" y="516" font-size="27" fill="#F8F5FF" font-weight="700">Rápida e leve</text><text x="1144" y="514" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">NUVEM</text><text x="108" y="552" font-size="22" fill="#BCB1D2">Só os trechos de fala, em Opus: 9 min de call em 10 a 14 s.</text><circle cx="87" cy="597" r="6" fill="#FFC61A"/><text x="108" y="606" font-size="27" fill="#F8F5FF" font-weight="700">Gasto da nuvem</text><text x="1144" y="604" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">NUVEM</text><text x="108" y="642" font-size="22" fill="#BCB1D2">Créditos e US$ da ElevenLabs, minutos do Grok, no mês.</text><path d="M56 719H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="761" width="6" height="30" rx="3" fill="#2DD29A"/><text x="80" y="786" font-size="25" fill="#2DD29A" font-weight="700" letter-spacing="3">MELHORIAS</text><text x="1144" y="785" font-size="19" fill="#BCB1D2" text-anchor="end">2 itens</text><circle cx="87" cy="826" r="6" fill="#2DD29A"/><text x="108" y="835" font-size="27" fill="#F8F5FF" font-weight="700">Ditado livre durante a reunião</text><text x="1144" y="833" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">DITADO</text><text x="108" y="871" font-size="22" fill="#BCB1D2">Na nuvem, a reunião não segura o ditado nem a troca de modelo.</text><circle cx="87" cy="916" r="6" fill="#2DD29A"/><text x="108" y="925" font-size="27" fill="#F8F5FF" font-weight="700">Falantes fixos no importado</text><text x="1144" y="923" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">IMPORTAR</text><text x="108" y="961" font-size="22" fill="#BCB1D2">A ElevenLabs recebe o número de pessoas que você escolher.</text><path d="M56 1038H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="1080" width="6" height="30" rx="3" fill="#30BCEF"/><text x="80" y="1105" font-size="25" fill="#30BCEF" font-weight="700" letter-spacing="3">CORREÇÕES</text><text x="1144" y="1104" font-size="19" fill="#BCB1D2" text-anchor="end">1 item</text><circle cx="87" cy="1145" r="6" fill="#30BCEF"/><text x="108" y="1154" font-size="27" fill="#F8F5FF" font-weight="700">Refazer não trava o MODELO</text><text x="1144" y="1152" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">HISTÓRICO</text><text x="108" y="1190" font-size="22" fill="#BCB1D2">MODELO e EXECUTAR EM voltam a responder no fim do Refazer.</text><path d="M56 1267H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="1309" width="6" height="30" rx="3" fill="#AA88FA"/><text x="80" y="1334" font-size="25" fill="#AA88FA" font-weight="700" letter-spacing="3">PRA ATUALIZAR</text><text x="1144" y="1333" font-size="19" fill="#BCB1D2" text-anchor="end">1 item</text><circle cx="87" cy="1374" r="6" fill="#AA88FA"/><text x="108" y="1383" font-size="27" fill="#F8F5FF" font-weight="700">git pull e pronto</text><text x="1144" y="1381" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">APP</text><text x="108" y="1419" font-size="22" fill="#BCB1D2">Sem dependência nova; as credenciais são as do ditado.</text><path d="M56 1508H1144" stroke="#76638C" opacity=".35"/><text x="56" y="1556" font-size="23" fill="#FFC89A" font-weight="700">Notebook sem NVIDIA? MOTOR no Grok e a reunião sai com cada voz no lugar.</text><text x="56" y="1598" font-size="20" fill="#BCB1D2">Notas completas, como atualizar e validações no GitHub Releases.</text><text x="56" y="1636" font-size="16" fill="#9C8DB8" font-weight="700" letter-spacing="2.5">GITHUB.COM/LUCASOL1337/SUSSURRO/RELEASES</text></svg>
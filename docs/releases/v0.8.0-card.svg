<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2244" viewBox="0 0 1200 2244" font-family="Noto Sans, Liberation Sans, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#160D31"/><stop offset="1" stop-color="#28184D"/></linearGradient><linearGradient id="pill" x1="0" x2="1"><stop stop-color="#C98A6B"/><stop offset="1" stop-color="#8E5CF0"/></linearGradient></defs><rect width="1200" height="2244" fill="url(#bg)"/><path d="M920 30L1196 300M1000 30L1196 226" stroke="#BCB1D2" opacity=".08"/><path d="M28 70V28H70M1130 28H1172V70M28 2174V2216H70M1130 2216H1172V2174" fill="none" stroke="#76638C" stroke-width="2" opacity=".8"/><text x="56" y="92" font-size="46" fill="#F8F5FF" font-weight="700">sussurro</text><rect x="262" y="58" width="112" height="44" rx="22" fill="url(#pill)"/><text x="318" y="88" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">v0.8.0</text><text x="56" y="144" font-size="22" fill="#FFC89A" font-weight="700" letter-spacing="3">NOTAS DA ATUALIZAÇÃO</text><text x="1144" y="88" font-size="20" fill="#BCB1D2" text-anchor="end">16 de outubro de 2026</text><path d="M56 178H1144" stroke="#76638C" opacity=".55"/><text x="56" y="218" font-size="20" fill="#BCB1D2">Ditado na nuvem · motor sempre à vista · microfones de verdade</text><rect x="56" y="262" width="6" height="30" rx="3" fill="#FFC61A"/><text x="80" y="287" font-size="25" fill="#FFC61A" font-weight="700" letter-spacing="3">NOVIDADES</text><text x="1144" y="286" font-size="19" fill="#BCB1D2" text-anchor="end">4 itens</text><circle cx="87" cy="327" r="6" fill="#FFC61A"/><text x="108" y="336" font-size="27" fill="#F8F5FF" font-weight="700">Ditado na nuvem</text><text x="1144" y="334" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">NUVEM</text><text x="108" y="372" font-size="22" fill="#BCB1D2">ElevenLabs Scribe e Grok, sem ocupar VRAM; cai no Turbo se a rede falhar.</text><circle cx="87" cy="417" r="6" fill="#FFC61A"/><text x="108" y="426" font-size="27" fill="#F8F5FF" font-weight="700">EM USO AGORA</text><text x="1144" y="424" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">MODELO</text><text x="108" y="462" font-size="22" fill="#BCB1D2">Mostra quem transcreve o próximo trecho: Grok na nuvem ou a GPU NVIDIA.</text><circle cx="87" cy="507" r="6" fill="#FFC61A"/><text x="108" y="516" font-size="27" fill="#F8F5FF" font-weight="700">Liberar espaço no histórico</text><text x="1144" y="514" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">HISTÓRICO</text><text x="108" y="552" font-size="22" fill="#BCB1D2">Apaga o áudio antigo depois de mostrar quanto sai; o texto fica.</text><circle cx="87" cy="597" r="6" fill="#FFC61A"/><text x="108" y="606" font-size="27" fill="#F8F5FF" font-weight="700">Reunião na barra</text><text x="1144" y="604" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">REUNIÃO</text><text x="108" y="642" font-size="22" fill="#BCB1D2">A bolinha mostra REUNIAO e o tempo gravado, mesmo fora da aba.</text><path d="M56 702H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="746" width="6" height="30" rx="3" fill="#2DD29A"/><text x="80" y="771" font-size="25" fill="#2DD29A" font-weight="700" letter-spacing="3">MELHORIAS</text><text x="1144" y="770" font-size="19" fill="#BCB1D2" text-anchor="end">5 itens</text><circle cx="87" cy="811" r="6" fill="#2DD29A"/><text x="108" y="820" font-size="27" fill="#F8F5FF" font-weight="700">Trocar de modelo é um clique</text><text x="1144" y="818" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">MODELO</text><text x="108" y="856" font-size="22" fill="#BCB1D2">Escolher no combo já carrega; acabou o botão Aplicar modelo.</text><circle cx="87" cy="901" r="6" fill="#2DD29A"/><text x="108" y="910" font-size="27" fill="#F8F5FF" font-weight="700">Microfone sem lixo</text><text x="1144" y="908" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">ÁUDIO</text><text x="108" y="946" font-size="22" fill="#BCB1D2">Só Padrão do PC e os microfones conectados de verdade.</text><circle cx="87" cy="991" r="6" fill="#2DD29A"/><text x="108" y="1000" font-size="27" fill="#F8F5FF" font-weight="700">Refazer direto</text><text x="1144" y="998" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">HISTÓRICO</text><text x="108" y="1036" font-size="22" fill="#BCB1D2">Roda na hora com o modelo e o idioma atuais, sem diálogo.</text><circle cx="87" cy="1081" r="6" fill="#2DD29A"/><text x="108" y="1090" font-size="27" fill="#F8F5FF" font-weight="700">Modelo volta sozinho</text><text x="1144" y="1088" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">GPU</text><text x="108" y="1126" font-size="22" fill="#BCB1D2">Depois de uma falha CUDA, recarrega em 5 s sem precisar de clique.</text><circle cx="87" cy="1171" r="6" fill="#2DD29A"/><text x="108" y="1180" font-size="27" fill="#F8F5FF" font-weight="700">Comandos de reunião confirmam</text><text x="1144" y="1178" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">LINUX</text><text x="108" y="1216" font-size="22" fill="#BCB1D2">meeting-start, stop e pause respondem ok ou err.</text><path d="M56 1276H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="1320" width="6" height="30" rx="3" fill="#30BCEF"/><text x="80" y="1345" font-size="25" fill="#30BCEF" font-weight="700" letter-spacing="3">CORREÇÕES</text><text x="1144" y="1344" font-size="19" fill="#BCB1D2" text-anchor="end">4 itens</text><circle cx="87" cy="1385" r="6" fill="#30BCEF"/><text x="108" y="1394" font-size="27" fill="#F8F5FF" font-weight="700">Ditar com o Sussurro em foco</text><text x="1144" y="1392" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">DITADO</text><text x="108" y="1430" font-size="22" fill="#BCB1D2">Vai só pro histórico, sem ser marcado como falha.</text><circle cx="87" cy="1475" r="6" fill="#30BCEF"/><text x="108" y="1484" font-size="27" fill="#F8F5FF" font-weight="700">Refazer com termo hifenizado</text><text x="1144" y="1482" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">BIBLIOTECA</text><text x="108" y="1520" font-size="22" fill="#BCB1D2">claude-code vira Claude Code sem quebrar o Refazer.</text><circle cx="87" cy="1565" r="6" fill="#30BCEF"/><text x="108" y="1574" font-size="27" fill="#F8F5FF" font-weight="700">Transcrever arquivo no meio do ditado</text><text x="1144" y="1572" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">HERMES</text><text x="108" y="1610" font-size="22" fill="#BCB1D2">Responde ocupado em vez de disputar o modelo.</text><circle cx="87" cy="1655" r="6" fill="#30BCEF"/><text x="108" y="1664" font-size="27" fill="#F8F5FF" font-weight="700">Reunião que falha ao iniciar</text><text x="1144" y="1662" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">REUNIÃO</text><text x="108" y="1700" font-size="22" fill="#BCB1D2">Não deixa mais uma gravação interrompida falsa.</text><path d="M56 1760H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="1804" width="6" height="30" rx="3" fill="#AA88FA"/><text x="80" y="1829" font-size="25" fill="#AA88FA" font-weight="700" letter-spacing="3">PRA ATUALIZAR</text><text x="1144" y="1828" font-size="19" fill="#BCB1D2" text-anchor="end">2 itens</text><circle cx="87" cy="1869" r="6" fill="#AA88FA"/><text x="108" y="1878" font-size="27" fill="#F8F5FF" font-weight="700">Canal do PC e Parakeet saíram</text><text x="1144" y="1876" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">APP</text><text x="108" y="1914" font-size="22" fill="#BCB1D2">O áudio do PC é a saída padrão; quem usava Parakeet vai pro Turbo.</text><circle cx="87" cy="1959" r="6" fill="#AA88FA"/><text x="108" y="1968" font-size="27" fill="#F8F5FF" font-weight="700">Credencial da nuvem fora do app</text><text x="1144" y="1966" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">NUVEM</text><text x="108" y="2004" font-size="22" fill="#BCB1D2">ELEVENLABS_API_KEY, XAI_API_KEY, chaveiro ou grok login.</text><path d="M56 2064H1144" stroke="#76638C" opacity=".35"/><text x="56" y="2112" font-size="23" fill="#FFC89A" font-weight="700">Escolha o Grok e veja na hora: EM USO AGORA diz quem vai escrever.</text><text x="56" y="2154" font-size="20" fill="#BCB1D2">Notas completas, como atualizar e validações no GitHub Releases.</text><text x="56" y="2192" font-size="16" fill="#9C8DB8" font-weight="700" letter-spacing="2.5">GITHUB.COM/LUCASOL1337/SUSSURRO/RELEASES</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1198" viewBox="0 0 1200 1198">
<style>text{font-family:Inter,"Noto Sans","Segoe UI",system-ui,sans-serif}</style>
<rect width="1200" height="1198" fill="#FFFFFF"/>
<rect width="1200" height="6" fill="#1D4ED8"/><text x="56" y="92" font-size="40" font-weight="700" fill="#111827" text-anchor="start" letter-spacing="-0.4"><tspan x="56" dy="0">Sussurro</tspan></text><rect x="259.6" y="64" width="105.08" height="36" rx="18" fill="#EFF4FF"/><text x="312.14000000000004" y="88" font-size="18" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="0"><tspan x="312.14000000000004" dy="0">v0.12.0</tspan></text><text x="1144" y="72" font-size="15" font-weight="700" fill="#374151" text-anchor="end" letter-spacing="4"><tspan x="1144" dy="0">LUCASOL</tspan></text><text x="1144" y="98" font-size="16" font-weight="400" fill="#6B7280" text-anchor="end" letter-spacing="0"><tspan x="1144" dy="0">20 NOV 2026</tspan></text><text x="56" y="142" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="2.6"><tspan x="56" dy="0">NOTAS DA ATUALIZAÇÃO</tspan></text><rect x="56" y="160" width="132.07999999999998" height="34" rx="8" fill="#FFF8EC"/><text x="122.03999999999999" y="182" font-size="16" font-weight="600" fill="#B45309" text-anchor="middle" letter-spacing="0"><tspan x="122.03999999999999" dy="0">4 novidades</tspan></text><rect x="198.07999999999998" y="160" width="132.07999999999998" height="34" rx="8" fill="#EAF7EE"/><text x="264.12" y="182" font-size="16" font-weight="600" fill="#15803D" text-anchor="middle" letter-spacing="0"><tspan x="264.12" dy="0">2 melhorias</tspan></text><line x1="56" y1="220" x2="1144" y2="220" stroke="#E5E7EB" stroke-width="2"/><rect x="56" y="248" width="5" height="24" rx="2.5" fill="#B45309"/><text x="74" y="268" font-size="17" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="2"><tspan x="74" dy="0">NOVIDADES</tspan></text><rect x="206.04000000000002" y="249" width="30" height="24" rx="12" fill="#FFF8EC"/><text x="221.04000000000002" y="267" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle" letter-spacing="0"><tspan x="221.04000000000002" dy="0">4</tspan></text><circle cx="64" cy="312" r="5" fill="#B45309"/><text x="86" y="320" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Barra de ditado no estilo do Wispr Flow</tspan></text><text x="86" y="355" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Cápsula preta de 103×30 com × e ✓; dez barrinhas pulsam com a sua voz e um círculo</tspan><tspan x="86" dy="27">gira enquanto transcreve.</tspan></text><text x="1144" y="318" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">BARRA</tspan></text><line x1="86" y1="420" x2="1144" y2="420" stroke="#E5E7EB"/><circle cx="64" cy="436" r="5" fill="#B45309"/><text x="86" y="444" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Janela nova em tema claro, com barra lateral</tspan></text><text x="86" y="479" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Ditado, Ao vivo, Reunião, Estatísticas, Dicionário, Comparar e Omarchy num menu</tspan><tspan x="86" dy="27">lateral; Configurações embaixo.</tspan></text><text x="1144" y="442" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">JANELA</tspan></text><line x1="86" y1="544" x2="1144" y2="544" stroke="#E5E7EB"/><circle cx="64" cy="560" r="5" fill="#B45309"/><text x="86" y="568" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Histórico por dia, com seus números ao lado</tspan></text><text x="86" y="603" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Hoje, Ontem e datas em molduras, hora à esquerda, tocar e copiar no hover;</tspan><tspan x="86" dy="27">palavras, ppm, dias seguidos e tempo poupado.</tspan></text><text x="1144" y="566" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">DITADO</tspan></text><line x1="86" y1="668" x2="1144" y2="668" stroke="#E5E7EB"/><circle cx="64" cy="684" r="5" fill="#B45309"/><text x="86" y="692" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Configurações em linhas</tspan></text><text x="86" y="727" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Cada ajuste com título, explicação e controle à direita; o modelo em uso e o gasto</tspan><tspan x="86" dy="27">da nuvem ficam sempre à vista na lateral.</tspan></text><text x="1144" y="690" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">CONFIGURAÇÕES</tspan></text><rect x="56" y="802" width="5" height="24" rx="2.5" fill="#15803D"/><text x="74" y="822" font-size="17" font-weight="700" fill="#15803D" text-anchor="start" letter-spacing="2"><tspan x="74" dy="0">MELHORIAS</tspan></text><rect x="206.04000000000002" y="803" width="30" height="24" rx="12" fill="#EAF7EE"/><text x="221.04000000000002" y="821" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle" letter-spacing="0"><tspan x="221.04000000000002" dy="0">2</tspan></text><circle cx="64" cy="866" r="5" fill="#15803D"/><text x="86" y="874" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Todas as páginas no tema claro</tspan></text><text x="86" y="909" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Estatísticas, Dicionário, Reunião e Comparar acompanham o visual novo; gráficos em</tspan><tspan x="86" dy="27">verde-azulado.</tspan></text><text x="1144" y="872" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">INTERFACE</tspan></text><line x1="86" y1="974" x2="1144" y2="974" stroke="#E5E7EB"/><circle cx="64" cy="990" r="5" fill="#15803D"/><text x="86" y="998" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Fontes Figtree e EB Garamond</tspan></text><text x="86" y="1033" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Licença livre (SIL OFL), instaladas pelo próprio app ao abrir; sem elas, ficam as</tspan><tspan x="86" dy="27">fontes do sistema.</tspan></text><text x="1144" y="996" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="1.2"><tspan x="1144" dy="0">INTERFACE</tspan></text><line x1="56" y1="1128" x2="1144" y2="1128" stroke="#E5E7EB" stroke-width="2"/><text x="56" y="1162" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0"><tspan x="56" dy="0">Notas completas: github.com/LucasOl1337/sussurro/releases/tag/v0.12.0</tspan></text>
</svg>

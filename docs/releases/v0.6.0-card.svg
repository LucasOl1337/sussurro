<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1186" viewBox="0 0 1200 1186" font-family="Noto Sans, Liberation Sans, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#160D31"/><stop offset="1" stop-color="#28184D"/></linearGradient><linearGradient id="pill" x1="0" x2="1"><stop stop-color="#C98A6B"/><stop offset="1" stop-color="#8E5CF0"/></linearGradient></defs><rect width="1200" height="1186" fill="url(#bg)"/><path d="M920 30L1196 300M1000 30L1196 226" stroke="#BCB1D2" opacity=".08"/><path d="M28 70V28H70M1130 28H1172V70M28 1116V1158H70M1130 1158H1172V1116" fill="none" stroke="#76638C" stroke-width="2" opacity=".8"/><text x="56" y="92" font-size="46" fill="#F8F5FF" font-weight="700" text-anchor="start">sussurro</text><rect x="262" y="58" width="112" height="44" rx="22" fill="url(#pill)"/><text x="318" y="88" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">v0.6.0</text><text x="56" y="144" font-size="22" fill="#FFC89A" font-weight="700" text-anchor="start" letter-spacing="3">NOTAS DA ATUALIZAÇÃO</text><text x="1144" y="88" font-size="20" fill="#BCB1D2" font-weight="400" text-anchor="end">27 de setembro de 2026</text><path d="M56 178H1144" stroke="#76638C" opacity=".55"/><text x="56" y="218" font-size="20" fill="#BCB1D2" font-weight="400" text-anchor="start">Reuniões com quem falou o quê · Parakeet na GPU · ditado mais limpo</text><rect x="56" y="262" width="6" height="30" rx="3" fill="#FFC61A"/><text x="80" y="287" font-size="25" fill="#FFC61A" font-weight="700" text-anchor="start" letter-spacing="3">NOVIDADES</text><text x="1144" y="286" font-size="19" fill="#BCB1D2" font-weight="400" text-anchor="end">4 itens</text><circle cx="87" cy="327" r="6" fill="#FFC61A"/><text x="108" y="336" font-size="27" fill="#F8F5FF" font-weight="700" text-anchor="start">Reuniões transcritas</text><text x="1144" y="334" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">LINUX</text><text x="108" y="372" font-size="22" fill="#BCB1D2" font-weight="400" text-anchor="start">Microfone e áudio do PC em trilhas separadas, transcritos na GPU.</text><circle cx="87" cy="417" r="6" fill="#FFC61A"/><text x="108" y="426" font-size="27" fill="#F8F5FF" font-weight="700" text-anchor="start">Quem falou o quê</text><text x="1144" y="424" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">LINUX</text><text x="108" y="462" font-size="22" fill="#BCB1D2" font-weight="400" text-anchor="start">Você, Remoto 1, Remoto 2: vozes separadas até do mesmo lado.</text><circle cx="87" cy="507" r="6" fill="#FFC61A"/><text x="108" y="516" font-size="27" fill="#F8F5FF" font-weight="700" text-anchor="start">Importar e recuperar</text><text x="1144" y="514" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">LINUX</text><text x="108" y="552" font-size="22" fill="#BCB1D2" font-weight="400" text-anchor="start">Qualquer arquivo de áudio vira transcrição; a gravação sobrevive a uma queda.</text><circle cx="87" cy="597" r="6" fill="#FFC61A"/><text x="108" y="606" font-size="27" fill="#F8F5FF" font-weight="700" text-anchor="start">Parakeet da NVIDIA</text><text x="1144" y="604" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">GPU</text><text x="108" y="642" font-size="22" fill="#BCB1D2" font-weight="400" text-anchor="start">O modelo mais rápido do seletor; em português às vezes escorrega pro inglês.</text><path d="M56 702H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="746" width="6" height="30" rx="3" fill="#2DD29A"/><text x="80" y="771" font-size="25" fill="#2DD29A" font-weight="700" text-anchor="start" letter-spacing="3">MELHORIAS</text><text x="1144" y="770" font-size="19" fill="#BCB1D2" font-weight="400" text-anchor="end">2 itens</text><circle cx="87" cy="811" r="6" fill="#2DD29A"/><text x="108" y="820" font-size="27" fill="#F8F5FF" font-weight="700" text-anchor="start">Ditado sem “Tchau.” fantasma</text><text x="1144" y="818" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">DITADO</text><text x="108" y="856" font-size="22" fill="#BCB1D2" font-weight="400" text-anchor="start">A frase que o Whisper inventa no silêncio do fim não é mais colada.</text><circle cx="87" cy="901" r="6" fill="#2DD29A"/><text x="108" y="910" font-size="27" fill="#F8F5FF" font-weight="700" text-anchor="start">Sete abas na janela</text><text x="1144" y="908" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">APP</text><text x="108" y="946" font-size="22" fill="#BCB1D2" font-weight="400" text-anchor="start">REUNIÃO entrou e OMARCHY continua inteira no fim.</text><path d="M56 1006H1144" stroke="#76638C" opacity=".35"/><text x="56" y="1054" font-size="23" fill="#FFC89A" font-weight="700" text-anchor="start">Grave a call, pare, e a transcrição sai separada por quem falou.</text><text x="56" y="1096" font-size="20" fill="#BCB1D2" font-weight="400" text-anchor="start">Notas completas, bench e validações no GitHub Releases.</text><text x="56" y="1134" font-size="16" fill="#9C8DB8" font-weight="700" text-anchor="start" letter-spacing="2.5">GITHUB.COM/LUCASOL1337/SUSSURRO/RELEASES</text></svg>
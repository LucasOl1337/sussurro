<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1760" viewBox="0 0 1200 1760" font-family="Noto Sans, Liberation Sans, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#160D31"/><stop offset="1" stop-color="#28184D"/></linearGradient><linearGradient id="pill" x1="0" x2="1"><stop stop-color="#C98A6B"/><stop offset="1" stop-color="#8E5CF0"/></linearGradient></defs><rect width="1200" height="1760" fill="url(#bg)"/><path d="M920 30L1196 300M1000 30L1196 226" stroke="#BCB1D2" opacity=".08"/><path d="M28 70V28H70M1130 28H1172V70M28 1690V1732H70M1130 1732H1172V1690" fill="none" stroke="#76638C" stroke-width="2" opacity=".8"/><text x="56" y="92" font-size="46" fill="#F8F5FF" font-weight="700">sussurro</text><rect x="262" y="58" width="112" height="44" rx="22" fill="url(#pill)"/><text x="318" y="88" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">v0.7.0</text><text x="56" y="144" font-size="22" fill="#FFC89A" font-weight="700" letter-spacing="3">NOTAS DA ATUALIZAÇÃO</text><text x="1144" y="88" font-size="20" fill="#BCB1D2" text-anchor="end">2 de outubro de 2026</text><path d="M56 178H1144" stroke="#76638C" opacity=".55"/><text x="56" y="218" font-size="20" fill="#BCB1D2">Bolinha que obedece · cancelar por atalho · colagem na janela certa</text><rect x="56" y="262" width="6" height="30" rx="3" fill="#FFC61A"/><text x="80" y="287" font-size="25" fill="#FFC61A" font-weight="700" letter-spacing="3">NOVIDADES</text><text x="1144" y="286" font-size="19" fill="#BCB1D2" text-anchor="end">5 itens</text><circle cx="87" cy="327" r="6" fill="#FFC61A"/><text x="108" y="336" font-size="27" fill="#F8F5FF" font-weight="700">X e ✓ da bolinha funcionando</text><text x="1144" y="334" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">HYPRLAND</text><text x="108" y="372" font-size="22" fill="#BCB1D2">Clicar, confirmar e arrastar a barra, sem ela roubar o foco.</text><circle cx="87" cy="417" r="6" fill="#FFC61A"/><text x="108" y="426" font-size="27" fill="#F8F5FF" font-weight="700">Cancelar por atalho</text><text x="1144" y="424" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">LINUX</text><text x="108" y="462" font-size="22" fill="#BCB1D2">sussurro cancel joga o ditado fora: nada colado, nada salvo.</text><circle cx="87" cy="507" r="6" fill="#FFC61A"/><text x="108" y="516" font-size="27" fill="#F8F5FF" font-weight="700">Refazer no histórico</text><text x="1144" y="514" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">DITADO</text><text x="108" y="552" font-size="22" fill="#BCB1D2">Transcreve o mesmo áudio de novo com outro modelo ou idioma.</text><circle cx="87" cy="597" r="6" fill="#FFC61A"/><text x="108" y="606" font-size="27" fill="#F8F5FF" font-weight="700">Fechar só esconde</text><text x="1144" y="604" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">LINUX</text><text x="108" y="642" font-size="22" fill="#BCB1D2">Motor e atalhos seguem vivos; sussurro show reabre, quit encerra.</text><circle cx="87" cy="687" r="6" fill="#FFC61A"/><text x="108" y="696" font-size="27" fill="#F8F5FF" font-weight="700">Sons de início, fim e erro</text><text x="1144" y="694" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">OPCIONAL</text><text x="108" y="732" font-size="22" fill="#BCB1D2">Tons curtos e baixos, desligados por padrão.</text><path d="M56 792H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="836" width="6" height="30" rx="3" fill="#2DD29A"/><text x="80" y="861" font-size="25" fill="#2DD29A" font-weight="700" letter-spacing="3">MELHORIAS</text><text x="1144" y="860" font-size="19" fill="#BCB1D2" text-anchor="end">5 itens</text><circle cx="87" cy="901" r="6" fill="#2DD29A"/><text x="108" y="910" font-size="27" fill="#F8F5FF" font-weight="700">Colagem na janela certa</text><text x="1144" y="908" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">DITADO</text><text x="108" y="946" font-size="22" fill="#BCB1D2">O texto cai onde você começou a falar, mesmo se mexer o mouse.</text><circle cx="87" cy="991" r="6" fill="#2DD29A"/><text x="108" y="1000" font-size="27" fill="#F8F5FF" font-weight="700">Ditado longo sem engasgo</text><text x="1144" y="998" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">DITADO</text><text x="108" y="1036" font-size="22" fill="#BCB1D2">Colar não segura o próximo trecho; o corte cai na sua pausa.</text><circle cx="87" cy="1081" r="6" fill="#2DD29A"/><text x="108" y="1090" font-size="27" fill="#F8F5FF" font-weight="700">Bolinha avisa o que houve</text><text x="1144" y="1088" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">APP</text><text x="108" y="1126" font-size="22" fill="#BCB1D2">Ocupado, erro e microfone que parou de mandar áudio aparecem.</text><circle cx="87" cy="1171" r="6" fill="#2DD29A"/><text x="108" y="1180" font-size="27" fill="#F8F5FF" font-weight="700">Ditado vazio explica o porquê</text><text x="1144" y="1178" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">DITADO</text><text x="108" y="1216" font-size="22" fill="#BCB1D2">Microfone sem sinal, áudio baixo demais ou fala não reconhecida.</text><circle cx="87" cy="1261" r="6" fill="#2DD29A"/><text x="108" y="1270" font-size="27" fill="#F8F5FF" font-weight="700">GPU que falha se recupera</text><text x="1144" y="1268" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">GPU</text><text x="108" y="1306" font-size="22" fill="#BCB1D2">Recarrega o modelo e repete o trecho antes de desistir.</text><path d="M56 1366H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="1410" width="6" height="30" rx="3" fill="#30BCEF"/><text x="80" y="1435" font-size="25" fill="#30BCEF" font-weight="700" letter-spacing="3">PRA ATUALIZAR</text><text x="1144" y="1434" font-size="19" fill="#BCB1D2" text-anchor="end">1 item</text><circle cx="87" cy="1475" r="6" fill="#30BCEF"/><text x="108" y="1484" font-size="27" fill="#F8F5FF" font-weight="700">Troque a regra da barra</text><text x="1144" y="1482" font-size="17" fill="#BCB1D2" font-weight="700" text-anchor="end" letter-spacing="2.5">HYPRLAND</text><text x="108" y="1520" font-size="22" fill="#BCB1D2">Em sussurro.lua, no_focus vira no_follow_mouse; depois hyprctl reload.</text><path d="M56 1580H1144" stroke="#76638C" opacity=".35"/><text x="56" y="1628" font-size="23" fill="#FFC89A" font-weight="700">Clique no X, e o ditado some. Fale, e o texto cai onde você estava.</text><text x="56" y="1670" font-size="20" fill="#BCB1D2">Notas completas, como atualizar e validações no GitHub Releases.</text><text x="56" y="1708" font-size="16" fill="#9C8DB8" font-weight="700" letter-spacing="2.5">GITHUB.COM/LUCASOL1337/SUSSURRO/RELEASES</text></svg>